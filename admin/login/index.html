<!DOCTYPE html>
<html lang="az">
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTUDY Admin — Giriş</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f7f9;
      color: #17232b;
    }
    .card {
      width: min(100%, 440px);
      background: #fff;
      border: 1px solid #e1e8eb;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 20px 55px rgba(20, 46, 55, .10);
    }
    .brand { font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    .brand span { color: #168a74; }
    .subtitle { color: #6c7a82; line-height: 1.6; margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    input {
      width: 100%; border: 1px solid #d5dfe3; border-radius: 13px;
      padding: 14px 15px; font-size: 15px; outline: none;
    }
    input:focus { border-color: #168a74; box-shadow: 0 0 0 4px rgba(22, 138, 116, .08); }
    button {
      width: 100%; border: 0; border-radius: 13px; padding: 15px;
      background: #127663; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message {
      display: none; margin-bottom: 18px; padding: 13px 14px;
      border-radius: 12px; font-size: 14px; line-height: 1.5;
    }
    .message.error { display: block; color: #9f3131; background: #fff1f1; border: 1px solid #ffd7d7; }
    .message.success { display: block; color: #176b58; background: #eefaf6; border: 1px solid #ccece3; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/logo-instudy.png" alt="Instudy" style="height:26px;display:block;"></div>
    <p class="subtitle">Admission Management System — yalnız səlahiyyətli əməkdaşlar üçün.</p>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Şifrə</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button id="loginButton" type="submit">Sistemə daxil ol</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../config.js"></script>
  <script>
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(type, text) {
      message.className = "message " + type;
      message.textContent = text;
    }

    function isAdminUser(user) {
      return user?.app_metadata?.role === "admin";
    }

    // Fail closed — see admin/index.html for the same fix; only used here
    // to pick a landing page, but kept consistent so no stale copy of the
    // dangerous "missing claim -> all" fallback remains anywhere.
    const VALID_STAFF_SCOPES = ["dma", "all"];
    function getStaffScope(user) {
      const scope = user?.app_metadata?.staff_scope;
      return VALID_STAFF_SCOPES.includes(scope) ? scope : "no_access";
    }


    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Daxil olunur...";
      message.className = "message";
      message.textContent = "";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await client.auth.signInWithPassword({ email, password });

        if (error) throw error;
        if (!data.session) throw new Error("Sessiya yaradıla bilmədi.");

        if (!isAdminUser(data.user)) {
          await client.auth.signOut();
          throw new Error("Bu hesabın admin panelinə giriş icazəsi yoxdur.");
        }

        showMessage("success", "Giriş uğurludur. Admin panel açılır...");

        setTimeout(() => {
          window.location.href = "/admin/index.html";
        }, 300);

      } catch (error) {
        console.error("Login error:", error);
        showMessage("error", error.message || "Giriş zamanı xəta baş verdi.");
        button.disabled = false;
        button.textContent = "Sistemə daxil ol";
      }
    });
  </script>
</body>
</html>
