<!DOCTYPE html>
<html lang="az">
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTUDY Admin — {TITLE}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:#FF6800; --ink:#17232b; --muted:#6d7b83;
      --line:#dfe7ea; --bg:#f4f7f9; --white:#fff;
    }
    body {
      min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:var(--bg); color:var(--ink);
    }
    #bootScreen {
      min-height:100vh; display:grid; place-items:center; color:var(--muted); padding:24px;
    }
    .shell { display:none; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
    .shell.ready { display:grid; }
    aside { background:#ffe9d6; color:#3a2418; padding:26px 18px; }
    .brand { font-size:28px; font-weight:800; padding:0 10px 28px; }
    .brand span { color:#FF6800; }
    nav a {
      display:block; color:rgba(58,36,24,.62); text-decoration:none;
      padding:12px 14px; border-radius:11px; margin-bottom:6px; font-weight:650; font-size:14px;
    }
    nav a.active { background:#ff6800; color:#fff; }
    main { min-width:0; }
    .topbar {
      min-height:76px; background:#fff; border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; padding:14px 28px; gap:20px;
    }
    .topbar h1 { font-size:21px; }
    .user-area { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13px; }
    .logout {
      border:1px solid var(--line); background:#fff; padding:9px 12px; border-radius:10px;
      cursor:pointer; font-weight:700;
    }
    .content { padding:28px; display:grid; gap:20px; grid-template-columns: 340px minmax(0,1fr); align-items:start; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
    .panel-head { padding:18px 20px; border-bottom:1px solid var(--line); font-weight:800; }
    .panel-body { padding:20px; }
    .field { margin-bottom:16px; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:7px; }
    input, select {
      width:100%; border:1px solid #d5dfe3; border-radius:11px; padding:11px 12px;
      font:inherit; background:#fff;
    }
    button {
      border:0; border-radius:11px; padding:13px; background:var(--green); color:#fff;
      font-weight:800; cursor:pointer; width:100%;
    }
    button:disabled { opacity:.6; cursor:wait; }
    .message { margin-bottom:14px; padding:11px 13px; border-radius:11px; font-size:13px; display:none; }
    .message.error { display:block; color:#9f3131; background:#fff1f1; border:1px solid #ffd7d7; }
    .message.success { display:block; color:#176b58; background:#eefaf6; border:1px solid #ccece3; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:14px 16px; border-bottom:1px solid #edf1f3; font-size:13px; }
    th { color:#6d7b83; font-size:12px; text-transform:uppercase; letter-spacing:.04em; background:#fbfcfd; }
    .seats { font-weight:800; }
    .seats.full { color:#a33d3d; }
    .loading,.empty,.error { padding:36px 20px; text-align:center; color:var(--muted); }
    .full-width { grid-column: 1 / -1; }
    .score-input { width:64px; }
    .mini-label { font-size:11px; color:var(--muted); font-weight:700; }
    .panel:has(> .filters-row) { position:sticky; top:0; z-index:5; margin-bottom:8px; }
    .filters-row { padding:8px 12px !important; }
    .status-select { border:1px solid #d5dfe3; border-radius:9px; padding:7px 9px; font-size:12px; font-weight:700; }
    .status-select:disabled, .score-input:disabled { opacity:.6; cursor:wait; }
    .delete-btn {
      width:auto; background:#fff; color:#a33d3d; border:1px solid #ffd7d7;
      border-radius:9px; padding:7px 12px; font-size:12px; font-weight:700;
    }
    .delete-btn:disabled { opacity:.6; cursor:wait; }
    @media (max-width:900px) {
      .shell.ready { grid-template-columns:1fr; }
      aside { display:none; }
      .content { grid-template-columns:1fr; padding:18px; }
    }
    .filters-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .filters-row select { padding:5px 8px; font-size:13px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; }
    .day-panel { margin-bottom:8px; }
    .day-head { display:flex; justify-content:space-between; padding:5px 12px; background:#fff7f0; border-bottom:1px solid var(--line); font-size:13px; }
    .slot-row { display:grid; grid-template-columns:48px 1fr auto; gap:8px; align-items:center; padding:5px 12px; border-bottom:1px solid var(--line); }
    .slot-time { font-weight:800; font-size:13px; color:var(--green); }
    .slot-name { font-weight:700; font-size:13px; color:var(--ink); text-decoration:none; }
    .slot-name:hover { color:var(--green); }
    .slot-sub { font-size:11px; color:var(--muted); }
    .slot-controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .slot-controls input, .slot-controls select { padding:3px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
    .score-input { width:80px; }
    .status-tag { font-size:12px; color:var(--muted); }
    .empty { padding:24px; color:var(--muted); text-align:center; }
  </style>
</head>
<body>
  <div id="bootScreen" style="
    min-height:100vh; display:grid; place-items:center;
    background:#f4f7f9; color:#6d7b83; padding:24px;
  ">
    <div>Admin panel yoxlanılır...</div>
  </div>

  <div id="appShell" class="shell">
    <aside>
      <div class="brand"><img src="/logo-instudy.png" alt="Instudy" style="height:32px;display:block;"></div>
      <nav>
        <a href="/admin/index.html">Namizədlər</a>
        <a class="active" href="/admin/exams/index.html">İmtahanlar</a>
        <a href="/admin/interviews/index.html">Müsahibələr</a>
        <a href="/admin/groups/index.html">DMA qrupları</a>
        <a href="/admin/attendance/index.html">Davamiyyət</a>
        <a href="/admin/graduates/index.html">Məzunlar</a>
      </nav>
    </aside>

    <main>
  <header class="topbar">
    <h1>İmtahanlar</h1>
    <div class="user-area">
      <span id="userEmail"></span>
      <button id="logoutButton" class="logout">Çıxış</button>
    </div>
  </header>

  <section class="content">
    <section class="panel">
      <div class="panel-body filters-row">
        <select id="rangeFilter">
          <option value="upcoming" selected>Gələcək</option>
          <option value="week">Növbəti 7 gün</option>
          <option value="past">Keçmiş</option>
          <option value="all">Hamısı</option>
        </select>
        <select id="programFilter"><option value="">Bütün proqramlar</option></select>
        <span id="pageMessage" class="message"></span>
      </div>
    </section>
    <div id="stateMessage" class="loading">Yüklənir...</div>
    <div id="scheduleList"></div>
  </section>
</main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../config.js"></script>
  <script>
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const CONFIG = {
      dateField: "exam_scheduled_at",
      controls: r => `
        <span class="mini-label">Tarix</span><input type="datetime-local" data-id="${r.id}" data-field="exam_scheduled_at" value="${toLocalInput(r.exam_scheduled_at)}">
        <span class="mini-label">Bal</span><input type="number" class="score-input" data-id="${r.id}" data-field="exam_score" value="${r.exam_score ?? ""}" placeholder="Bal">
        <span class="status-tag">${escapeHtml(statusLabel[r.current_status] || r.current_status)}</span>`,
      buildPayload: (r, field, el) => {
        if (field === "exam_scheduled_at") {
          const v = el.value ? new Date(el.value).toISOString() : null;
          const p = { exam_scheduled_at: v };
          if (v && r.current_status === "NEW_APPLICATION") p.current_status = "EXAM_BOOKED";
          if (!v && r.current_status === "EXAM_BOOKED") p.current_status = "NEW_APPLICATION";
          return p;
        }
        if (field === "exam_score") return { exam_score: el.value === "" ? null : Number(el.value) };
        return null;
      },
    };

    const bootScreen = document.getElementById("bootScreen");
    const appShell = document.getElementById("appShell");
    const stateMessage = document.getElementById("stateMessage");
    const listEl = document.getElementById("scheduleList");
    const rangeFilter = document.getElementById("rangeFilter");
    const programFilter = document.getElementById("programFilter");
    const pageMessage = document.getElementById("pageMessage");
    let rows = [];

    const statusLabel = {
      NEW_APPLICATION: "Yeni müraciət", EXAM_BOOKED: "İmtahan rezervasiyası", EXAM_PASSED: "İmtahandan keçdi",
      EXAM_FAILED: "İmtahandan kəsilib", INTERVIEW_INVITED: "Müsahibəyə dəvət", INTERVIEW_BOOKED: "Müsahibə rezervasiyası",
      INTERVIEW_PASSED: "Müsahibədən keçdi", INTERVIEW_FAILED: "Müsahibədən kəsilib", ENROLLED: "Təlimdədir",
      DECLINED: "İmtina edildi", ELIGIBLE: "Uyğundur",
    };

    function isAdminUser(user) { return user?.app_metadata?.role === "admin"; }
    const VALID_STAFF_SCOPES = ["dma", "all"];
    function getStaffScope(user) {
      const scope = user?.app_metadata?.staff_scope;
      return VALID_STAFF_SCOPES.includes(scope) ? scope : "no_access";
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function renderAccessGate(title, message) {
      bootScreen.innerHTML = `<div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p></div>`;
      bootScreen.style.display = "grid";
      appShell.classList.remove("ready");
    }

    function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
    function dayKey(iso) {
      const d = new Date(iso); const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function dayLabel(key) { const [y, m, d] = key.split("-"); return `${d}.${m}.${y}`; }
    function timeLabel(iso) { const d = new Date(iso); const p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
    function toLocalInput(iso) {
      if (!iso) return "";
      const d = new Date(iso); const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function showMessage(type, text) {
      pageMessage.className = "message " + type;
      pageMessage.textContent = text;
    }

    async function loadRows() {
      const { data, error } = await client
        .from("dma_applications")
        .select(`
          id, current_status, exam_scheduled_at, interview_scheduled_at, exam_score,
          interview_attended, interview_result,
          candidates:dma_candidates!dma_applications_candidate_id_fkey ( full_name, fin, whatsapp_phone ),
          programs:dma_programs!dma_applications_program_id_fkey ( id, name )
        `)
        .not(CONFIG.dateField, "is", null)
        .order(CONFIG.dateField, { ascending: true });
      if (error) throw error;
      rows = data || [];
    }

    function refreshProgramFilter() {
      const current = programFilter.value;
      const seen = new Map();
      rows.forEach(r => { if (r.programs) seen.set(r.programs.id, r.programs.name); });
      programFilter.innerHTML = `<option value="">Bütün proqramlar</option>` +
        [...seen.entries()].map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
      programFilter.value = current;
    }

    function passesRange(row) {
      const t = new Date(row[CONFIG.dateField]).getTime();
      const today = startOfToday();
      switch (rangeFilter.value) {
        case "upcoming": return t >= today;
        case "week": return t >= today && t < today + 7 * 86400000;
        case "past": return t < today;
        default: return true;
      }
    }

    function rowHtml(r) {
      const c = r.candidates || {};
      const p = r.programs || {};
      return `
        <div class="slot-row">
          <div class="slot-time">${timeLabel(r[CONFIG.dateField])}</div>
          <div>
            <a class="slot-name" href="candidates/index.html?id=${r.id}">${escapeHtml(c.full_name || "—")}</a>
            <div class="slot-sub">${escapeHtml(c.fin || "")} · ${escapeHtml(c.whatsapp_phone || "")} · ${escapeHtml(p.name || "")}</div>
          </div>
          <div class="slot-controls">${CONFIG.controls(r)}</div>
        </div>`;
    }

    function render() {
      const pid = programFilter.value;
      const filtered = rows.filter(r => passesRange(r) && (!pid || String(r.programs?.id) === pid));
      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty">Bu filtrdə qeyd yoxdur</div>`;
        return;
      }
      const groups = new Map();
      filtered.forEach(r => {
        const k = dayKey(r[CONFIG.dateField]);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(r);
      });
      listEl.innerHTML = [...groups.entries()].map(([k, list]) => `
        <section class="panel day-panel">
          <div class="day-head"><strong>${dayLabel(k)}</strong><span>${list.length} nəfər</span></div>
          ${list.map(rowHtml).join("")}
        </section>`).join("");
    }

    async function loadAndRender() {
      await loadRows();
      refreshProgramFilter();
      render();
    }

    listEl.addEventListener("change", async event => {
      const el = event.target;
      const id = Number(el.dataset.id);
      const field = el.dataset.field;
      const row = rows.find(r => r.id === id);
      if (!row || !field) return;
      const payload = CONFIG.buildPayload(row, field, el);
      if (!payload) return;
      el.disabled = true;
      const { error } = await client.from("dma_applications").update(payload).eq("id", id);
      if (error) {
        console.error("Schedule update error:", error);
        showMessage("error", "Yenilənmədi: " + error.message);
        await loadAndRender();
        return;
      }
      showMessage("success", "Saxlanıldı.");
      await loadAndRender();
    });

    rangeFilter.addEventListener("change", render);
    programFilter.addEventListener("change", render);

    async function init() {
      try {
        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
          renderAccessGate("Admin girişi tələb olunur", "Bu səhifəni görmək üçün əvvəlcə sistemə daxil olun.");
          return;
        }
        const { data: userData, error: userError } = await client.auth.getUser();
        if (userError) throw userError;
        const user = userData.user;
        if (!isAdminUser(user)) {
          await client.auth.signOut();
          renderAccessGate("Giriş qadağandır", "Bu hesabın admin panelinə giriş icazəsi yoxdur.");
          return;
        }
        if (!["dma", "all"].includes(getStaffScope(user))) {
          renderAccessGate("Giriş qadağandır", "Bu hesabın bu panelə giriş icazəsi yoxdur.");
          return;
        }
        document.getElementById("userEmail").textContent = user.email || "";
        bootScreen.style.display = "none";
        appShell.classList.add("ready");
        stateMessage.style.display = "none";
        await loadAndRender();
      } catch (error) {
        console.error("Schedule init error:", error);
        bootScreen.textContent = "Admin panel açılmadı: " + (error.message || "Naməlum xəta");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "/admin/login/index.html";
    });

    init();
  </script>
</body>
</html>
