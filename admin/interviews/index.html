<!DOCTYPE html>
<html lang="az">
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTUDY Admin — {TITLE}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:#FF6800; --ink:#17232b; --muted:#6d7b83;
      --line:#dfe7ea; --bg:#f4f7f9; --white:#fff;
    }
    body {
      min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:var(--bg); color:var(--ink);
    }
    #bootScreen {
      min-height:100vh; display:grid; place-items:center; color:var(--muted); padding:24px;
    }
    .shell { display:none; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
    .shell.ready { display:grid; }
    aside { background:#ffe9d6; color:#3a2418; padding:26px 18px; }
    .brand { font-size:28px; font-weight:800; padding:0 10px 28px; }
    .brand span { color:#FF6800; }
    nav a {
      display:block; color:rgba(58,36,24,.62); text-decoration:none;
      padding:12px 14px; border-radius:11px; margin-bottom:6px; font-weight:650; font-size:14px;
    }
    nav a.active { background:#ff6800; color:#fff; }
    main { min-width:0; }
    .topbar {
      min-height:76px; background:#fff; border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; padding:14px 28px; gap:20px;
    }
    .topbar h1 { font-size:21px; }
    .user-area { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13px; }
    .logout {
      border:1px solid var(--line); background:#fff; padding:9px 12px; border-radius:10px;
      cursor:pointer; font-weight:700;
    }
    .content { padding:28px; display:grid; gap:20px; grid-template-columns: 340px minmax(0,1fr); align-items:start; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
    .panel-head { padding:18px 20px; border-bottom:1px solid var(--line); font-weight:800; }
    .panel-body { padding:20px; }
    .field { margin-bottom:16px; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:7px; }
    input, select {
      width:100%; border:1px solid #d5dfe3; border-radius:11px; padding:11px 12px;
      font:inherit; background:#fff;
    }
    button {
      border:0; border-radius:11px; padding:13px; background:var(--green); color:#fff;
      font-weight:800; cursor:pointer; width:100%;
    }
    button:disabled { opacity:.6; cursor:wait; }
    .message { margin-bottom:14px; padding:11px 13px; border-radius:11px; font-size:13px; display:none; }
    .message.error { display:block; color:#9f3131; background:#fff1f1; border:1px solid #ffd7d7; }
    .message.success { display:block; color:#176b58; background:#eefaf6; border:1px solid #ccece3; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:14px 16px; border-bottom:1px solid #edf1f3; font-size:13px; }
    th { color:#6d7b83; font-size:12px; text-transform:uppercase; letter-spacing:.04em; background:#fbfcfd; }
    .seats { font-weight:800; }
    .seats.full { color:#a33d3d; }
    .loading,.empty,.error { padding:36px 20px; text-align:center; color:var(--muted); }
    .full-width { grid-column: 1 / -1; }
    .score-input { width:64px; }
    .mini-label { font-size:11px; color:var(--muted); font-weight:700; }
    .panel:has(> .filters-row) { position:sticky; top:0; z-index:5; margin-bottom:8px; }
    .filters-row { padding:8px 12px !important; }
    .status-select { border:1px solid #d5dfe3; border-radius:9px; padding:7px 9px; font-size:12px; font-weight:700; }
    .status-select:disabled, .score-input:disabled { opacity:.6; cursor:wait; }
    .delete-btn {
      width:auto; background:#fff; color:#a33d3d; border:1px solid #ffd7d7;
      border-radius:9px; padding:7px 12px; font-size:12px; font-weight:700;
    }
    .delete-btn:disabled { opacity:.6; cursor:wait; }
    @media (max-width:900px) {
      .shell.ready { grid-template-columns:1fr; }
      aside { display:none; }
      .content { grid-template-columns:1fr; padding:18px; }
    }
    .filters-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .filters-row select { padding:5px 8px; font-size:13px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; }
    .day-panel { margin-bottom:8px; }
    .day-head { display:flex; justify-content:space-between; padding:5px 12px; background:#fff7f0; border-bottom:1px solid var(--line); font-size:13px; }
    .slot-row { display:grid; grid-template-columns:48px 1fr auto; gap:8px; align-items:center; padding:5px 12px; border-bottom:1px solid var(--line); }
    .slot-time { font-weight:800; font-size:13px; color:var(--green); }
    .slot-name { font-weight:700; font-size:13px; color:var(--ink); text-decoration:none; }
    .slot-name:hover { color:var(--green); }
    .slot-sub { font-size:11px; color:var(--muted); }
    .slot-controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .slot-controls input, .slot-controls select { padding:3px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
    .score-input { width:80px; }
    .status-tag { font-size:12px; color:var(--muted); }
    .empty { padding:24px; color:var(--muted); text-align:center; }
    [hidden] { display:none !important; }
    .toolbar { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 0; }
    .toolbar select, .toolbar input { padding:5px 8px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; }
    .toolbar input[type=search] { min-width:260px; }
    .stats { display:flex; gap:6px; flex-wrap:wrap; }
    .stat { font-size:12px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
    .stat b { color:var(--green); }
    table.grid { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
    table.grid thead th { text-align:left; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:6px 10px; border-bottom:1px solid var(--line); background:#fafbfc; }
    table.grid td { padding:4px 10px; border-bottom:1px solid #eef2f4; font-size:13px; vertical-align:middle; height:50px; }
    table.grid tbody tr.data-row:hover td { background:#fff9f5; }
    .day-row td { background:#fff7f0; height:32px; padding:0 10px; font-size:12px; font-weight:700; border-bottom:1px solid var(--line); }
    .day-row td span:last-child { float:right; font-weight:600; color:var(--muted); }
    .c-time { width:64px; font-weight:800; color:var(--green); font-size:14px; }
    .c-prog { width:150px; color:var(--muted); font-size:12px; }
    .c-att, .c-res { width:140px; }
    .c-stat { width:170px; font-size:12px; color:var(--ink); }
    .c-act { width:40px; text-align:center; position:relative; }
    .name { font-weight:700; color:var(--ink); text-decoration:none; }
    .name:hover { color:var(--green); }
    .sub { font-size:11px; color:var(--muted); margin-top:1px; }
    .cell-select { height:26px; padding:0 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; background:#fff; width:100%; }
    .cell-select:disabled { opacity:.5; cursor:not-allowed; }
    .more { background:none; border:1px solid var(--line); border-radius:6px; width:28px; height:24px; cursor:pointer; line-height:1; }
    .menu { position:absolute; right:8px; top:30px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 16px #0002; z-index:20; min-width:170px; display:flex; flex-direction:column; text-align:left; }
    .menu a, .menu button { padding:7px 10px; font-size:13px; text-align:left; background:none; border:0; color:var(--ink); text-decoration:none; cursor:pointer; }
    .menu a:hover, .menu button:hover { background:#fff7f0; }
    .time-row td { background:#fbfcfd; height:auto; padding:6px 10px; }
    .time-edit { padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
    .empty { padding:24px; color:var(--muted); text-align:center; }
    @media (max-width:900px) { .c-prog { display:none; } }
    .content { grid-template-columns:minmax(0,1fr); gap:8px; padding:20px 24px; }
    .content > * { min-width:0; }
    .toolbar { margin:0; padding:0 0 4px; }
    #rangeFilter { width:160px; }
    #programFilter { width:200px; }
    #dayFilter { width:160px; }
    #searchInput { flex:1; min-width:220px; }
    .stats { min-height:24px; margin:0 0 6px; }
    .c-prog { width:180px; }
    table.grid td { height:56px; }
    .logout { width:auto; padding:9px 12px; color:var(--ink); background:#fff; }
    .more { width:28px; padding:0; color:var(--ink); background:#fff; }
  </style>
</head>
<body>
  <div id="bootScreen" style="
    min-height:100vh; display:grid; place-items:center;
    background:#f4f7f9; color:#6d7b83; padding:24px;
  ">
    <div>Admin panel yoxlanılır...</div>
  </div>

  <div id="appShell" class="shell">
    <aside>
      <div class="brand"><img src="/logo-instudy.png" alt="Instudy" style="height:32px;display:block;"></div>
      <nav>
        <a href="/admin/index.html">Namizədlər</a>
        <a href="/admin/exams/index.html">İmtahanlar</a>
        <a class="active" href="/admin/interviews/index.html">Müsahibələr</a>
        <a href="/admin/groups/index.html">DMA qrupları</a>
        <a href="/admin/attendance/index.html">Davamiyyət</a>
        <a href="/admin/graduates/index.html">Məzunlar</a>
      </nav>
    </aside>

    <main>
  <header class="topbar">
    <h1>Müsahibələr</h1>
    <div class="user-area">
      <span id="userEmail"></span>
      <button id="logoutButton" class="logout">Çıxış</button>
    </div>
  </header>

  <section class="content">
    <div class="toolbar">
      <select id="rangeFilter">
        <option value="upcoming" selected>Gələcək</option>
        <option value="week">Növbəti 7 gün</option>
        <option value="past">Keçmiş</option>
        <option value="all">Hamısı</option>
      </select>
      <select id="programFilter"><option value="">Bütün proqramlar</option></select>
      <input type="hidden" id="dayFilter" data-dp title="Tarix">
      <input type="search" id="searchInput" placeholder="Namizəd axtar (ad, telefon, FİN)...">
      <span id="pageMessage" class="message"></span>
    </div>
    <div class="stats" id="stats"></div>
    <div id="stateMessage" class="loading">Yüklənir...</div>
    <div id="scheduleList"></div>
  </section>
</main>


  </div>

  <script src="/shared/erp-datetime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../config.js"></script>
  <script src="/shared/erp-nav.js"></script>
  <script>
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const bootScreen = document.getElementById("bootScreen");
    const appShell = document.getElementById("appShell");
    const stateMessage = document.getElementById("stateMessage");
    const listEl = document.getElementById("scheduleList");
    const rangeFilter = document.getElementById("rangeFilter");
    const programFilter = document.getElementById("programFilter");
    const dayFilter = document.getElementById("dayFilter");
    const searchInput = document.getElementById("searchInput");
    const statsEl = document.getElementById("stats");
    const pageMessage = document.getElementById("pageMessage");
    let rows = [];

    const statusLabel = {
      NEW_APPLICATION: "Yeni müraciət", ELIGIBLE: "Uyğundur", EXAM_BOOKED: "İmtahan rezervasiyası",
      EXAM_FAILED: "İmtahandan kəsilib", EXAM_PASSED: "İmtahandan keçdi",
      INTERVIEW_INVITED: "Müsahibəyə dəvət", INTERVIEW_BOOKED: "Müsahibə rezervasiyası",
      INTERVIEW_PASSED: "DMA-ya gözləyir", INTERVIEW_FAILED: "Müsahibədən kəsilib",
      SUBMITTED_TO_DMA: "DMA-ya göndərildi", DMA_APPROVED: "DMA təsdiqi", DMA_REJECTED: "DMA rədd",
      ENROLLED: "Təlimdədir", GRADUATED: "Məzun", DECLINED: "İmtina edildi", NOT_ELIGIBLE: "Uyğun deyil",
    };
    const AZ_MONTHS = ["YANVAR", "FEVRAL", "MART", "APREL", "MAY", "İYUN", "İYUL", "AVQUST", "SENTYABR", "OKTYABR", "NOYABR", "DEKABR"];

    function isAdminUser(user) { return user?.app_metadata?.role === "admin"; }
    const VALID_STAFF_SCOPES = ["dma", "all"];
    function getStaffScope(user) {
      const scope = user?.app_metadata?.staff_scope;
      return VALID_STAFF_SCOPES.includes(scope) ? scope : "no_access";
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function renderAccessGate(title, message) {
      bootScreen.innerHTML = `<div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p></div>`;
      bootScreen.style.display = "grid";
      appShell.classList.remove("ready");
    }

    function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
    function dayKey(iso) {
      const d = new Date(iso); const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function dayTitle(key) { const [y, m, d] = key.split("-"); return `${d} ${AZ_MONTHS[Number(m) - 1]} ${y}`; }
    function timeLabel(iso) { const d = new Date(iso); const p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
    function toLocalInput(iso) {
      if (!iso) return "";
      const d = new Date(iso); const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function showMessage(type, text) { pageMessage.className = "message " + type; pageMessage.textContent = text; }

    async function loadRows() {
      const { data, error } = await client
        .from("dma_applications")
        .select(`
          id, current_status, interview_scheduled_at, interview_attended, interview_result, exam_score,
          candidates:dma_candidates!dma_applications_candidate_id_fkey ( full_name, fin, whatsapp_phone ),
          programs:dma_programs!dma_applications_program_id_fkey ( id, name )
        `)
        .not("interview_scheduled_at", "is", null)
        .order("interview_scheduled_at", { ascending: true });
      if (error) throw error;
      rows = data || [];
    }

    function refreshProgramFilter() {
      const current = programFilter.value;
      const seen = new Map();
      rows.forEach(r => { if (r.programs) seen.set(r.programs.id, r.programs.name); });
      programFilter.innerHTML = `<option value="">Bütün proqramlar</option>` +
        [...seen.entries()].map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
      programFilter.value = current;
    }

    function passesRange(r) {
      const t = new Date(r.interview_scheduled_at).getTime();
      const today = startOfToday();
      switch (rangeFilter.value) {
        case "upcoming": return t >= today;
        case "week": return t >= today && t < today + 7 * 86400000;
        case "past": return t < today;
        default: return true;
      }
    }

    function passesSearch(r) {
      const q = searchInput.value.trim().toLocaleLowerCase("az");
      if (!q) return true;
      const c = r.candidates || {};
      return [c.full_name, c.fin, c.whatsapp_phone].join(" ").toLocaleLowerCase("az").includes(q);
    }

    function visibleRows() {
      const pid = programFilter.value;
      const day = dayFilter.value;
      return rows.filter(r =>
        passesRange(r) &&
        (!pid || String(r.programs?.id) === pid) &&
        (!day || dayKey(r.interview_scheduled_at) === day) &&
        passesSearch(r)
      );
    }

    function renderStats(list) {
      const todayKey = dayKey(new Date().toISOString());
      const upcoming = rows.filter(r => new Date(r.interview_scheduled_at).getTime() >= startOfToday()).length;
      const today = list.filter(r => dayKey(r.interview_scheduled_at) === todayKey).length;
      const came = list.filter(r => r.interview_attended === "YES").length;
      const notCame = list.filter(r => r.interview_attended === "NO").length;
      const waiting = list.filter(r => r.interview_attended === "YES" && !r.interview_result).length;
      statsEl.innerHTML = `
        <span class="stat">Bu gün: <b>${today}</b></span>
        <span class="stat">Gələcək: <b>${upcoming}</b></span>
        <span class="stat">Gəldi: <b>${came}</b></span>
        <span class="stat">Gəlmədi: <b>${notCame}</b></span>
        <span class="stat">Nəticə gözləyir: <b>${waiting}</b></span>`;
    }

    function rowHtml(r) {
      const c = r.candidates || {};
      const p = r.programs || {};
      const attended = r.interview_attended;
      const result = r.interview_result;
      const hasDate = !!r.interview_scheduled_at;
      const examOk = r.exam_score === null || r.exam_score === undefined || r.exam_score >= 30;
      const resultOk = hasDate && attended !== null && attended !== undefined && examOk;
      return `
        <tr class="data-row">
          <td class="c-time">${timeLabel(r.interview_scheduled_at)}</td>
          <td>
            <a class="name" href="candidates/index.html?id=${r.id}">${escapeHtml(c.full_name || "—")}</a>
            <div class="sub">${escapeHtml(c.whatsapp_phone || "—")}</div>
          </td>
          <td class="c-prog">${escapeHtml(p.name || "—")}</td>
          <td class="c-att">
            <select class="cell-select" data-action="att" data-id="${r.id}" ${hasDate ? "" : "disabled"}>
              <option value="" ${attended == null ? "selected" : ""}>Gözlənilir</option>
              <option value="YES" ${attended === "YES" ? "selected" : ""}>Gəldi</option>
              <option value="NO" ${attended === "NO" ? "selected" : ""}>Gəlmədi</option>
            </select>
          </td>
          <td class="c-res">
            <select class="cell-select" data-action="res" data-id="${r.id}" ${resultOk ? "" : "disabled"}>
              <option value="" ${!result ? "selected" : ""}>Gözləyir</option>
              <option value="PASSED" ${result === "PASSED" ? "selected" : ""}>Keçdi</option>
              <option value="FAILED" ${result === "FAILED" ? "selected" : ""}>Keçmədi</option>
              <option value="RESERVE" ${result === "RESERVE" ? "selected" : ""}>Ehtiyat</option>
            </select>
          </td>
          <td class="c-stat">${escapeHtml(statusLabel[r.current_status] || "Prosesdədir")}</td>
          <td class="c-act">
            <button type="button" class="more" data-action="menu" data-id="${r.id}">⋯</button>
            <div class="menu" data-menu="${r.id}" hidden>
              <a href="candidates/index.html?id=${r.id}">Profili aç</a>
              <button type="button" data-action="time" data-id="${r.id}">Vaxtı dəyiş</button>
              <a href="candidates/index.html?id=${r.id}#note">Qeyd əlavə et</a>
            </div>
          </td>
        </tr>
        <tr class="time-row" data-time-row="${r.id}" hidden>
          <td colspan="7">
            <input type="hidden" class="time-edit" data-dtp data-id="${r.id}" data-field="interview_scheduled_at" value="${r.interview_scheduled_at || ""}">
          </td>
        </tr>`;
    }

    function render() {
      const list = visibleRows().sort((a, b) => new Date(a.interview_scheduled_at) - new Date(b.interview_scheduled_at));
      renderStats(list);
      if (!list.length) {
        listEl.innerHTML = `<div class="empty">Bu filtrdə qeyd yoxdur</div>`;
        return;
      }
      const todayKey = dayKey(new Date().toISOString());
      const tomorrowKey = dayKey(new Date(Date.now() + 86400000).toISOString());
      const groups = new Map();
      list.forEach(r => {
        const k = dayKey(r.interview_scheduled_at);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(r);
      });
      listEl.innerHTML = `
        <table class="grid">
          <thead>
            <tr>
              <th class="c-time">Saat</th>
              <th>Namizəd</th>
              <th class="c-prog">Proqram</th>
              <th class="c-att">İştirak</th>
              <th class="c-res">Nəticə</th>
              <th class="c-stat">Status</th>
              <th class="c-act"></th>
            </tr>
          </thead>
          ${[...groups.entries()].map(([k, items]) => {
            const prefix = k === todayKey ? "BUGÜN · " : k === tomorrowKey ? "SABAH · " : "";
            return `
              <tbody>
                <tr class="day-row"><td colspan="7"><span>${prefix}${dayTitle(k)}</span><span>${items.length} nəfər</span></td></tr>
                ${items.map(rowHtml).join("")}
              </tbody>`;
          }).join("")}
        </table>`;
      ERP.mountAll(listEl);
    }

    async function loadAndRender() {
      await loadRows();
      refreshProgramFilter();
      render();
    }

    function buildPayload(r, field, value) {
      if (field === "interview_scheduled_at") {
        const v = value ? new Date(value).toISOString() : null;
        const p = { interview_scheduled_at: v };
        if (v && r.current_status === "INTERVIEW_INVITED") p.current_status = "INTERVIEW_BOOKED";
        if (!v && r.current_status === "INTERVIEW_BOOKED") p.current_status = "INTERVIEW_INVITED";
        return p;
      }
      if (field === "interview_attended") {
        const v = value || null;
        const p = { interview_attended: v };
        if (v === "NO") p.interview_result = "FAILED";
        return p;
      }
      if (field === "interview_result") {
        const v = value || null;
        const p = { interview_result: v };
        if (v === "PASSED" && r.current_status === "INTERVIEW_BOOKED") p.current_status = "INTERVIEW_PASSED";
        if (v !== "PASSED" && r.current_status === "INTERVIEW_PASSED") p.current_status = "INTERVIEW_BOOKED";
        return p;
      }
      return null;
    }

    async function applyUpdate(id, field, value) {
      const r = rows.find(x => x.id === id);
      if (!r) return;
      const payload = buildPayload(r, field, value);
      if (!payload) return;
      const { error } = await client.from("dma_applications").update(payload).eq("id", id);
      if (error) {
        console.error("Interview update error:", error);
        showMessage("error", "Yenilənmədi: " + error.message);
        return;
      }
      showMessage("success", "Saxlanıldı.");
      await loadAndRender();
    }

    function closeMenus() {
      document.querySelectorAll(".menu").forEach(m => { m.hidden = true; });
    }

    listEl.addEventListener("click", event => {
      const el = event.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action;
      const id = Number(el.dataset.id);
      if (action === "menu") {
        const menu = listEl.querySelector(`[data-menu="${id}"]`);
        const wasHidden = menu.hidden;
        closeMenus();
        menu.hidden = !wasHidden;
        return;
      }
      closeMenus();
      if (action === "time") {
        const row = listEl.querySelector(`tr[data-time-row="${id}"]`);
        row.hidden = false;
        row.querySelector("input").focus();
      }
    });

    listEl.addEventListener("change", event => {
      const el = event.target;
      const id = Number(el.dataset.id);
      if (el.dataset.action === "att") applyUpdate(id, "interview_attended", el.value);
      if (el.dataset.action === "res") applyUpdate(id, "interview_result", el.value);
      if (el.classList.contains("time-edit")) applyUpdate(id, "interview_scheduled_at", el.value);
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".menu-wrap")) closeMenus();
    });

    [rangeFilter, programFilter, dayFilter].forEach(el => el.addEventListener("change", render));
    ERP.mountAll(document.querySelector(".toolbar"));
    searchInput.addEventListener("input", render);

    async function init() {
      try {
        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
          renderAccessGate("Admin girişi tələb olunur", "Bu səhifəni görmək üçün əvvəlcə sistemə daxil olun.");
          return;
        }
        const { data: userData, error: userError } = await client.auth.getUser();
        if (userError) throw userError;
        const user = userData.user;
        if (!isAdminUser(user)) {
          await client.auth.signOut();
          renderAccessGate("Giriş qadağandır", "Bu hesabın admin panelinə giriş icazəsi yoxdur.");
          return;
        }
        if (!["dma", "all"].includes(getStaffScope(user))) {
          renderAccessGate("Giriş qadağandır", "Bu hesabın bu panelə giriş icazəsi yoxdur.");
          return;
        }
        document.getElementById("userEmail").textContent = user.email || "";
        bootScreen.style.display = "none";
        appShell.classList.add("ready");
        stateMessage.style.display = "none";
        await loadAndRender();
      } catch (error) {
        console.error("Interview init error:", error);
        bootScreen.textContent = "Admin panel açılmadı: " + (error.message || "Naməlum xəta");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "/admin/login/index.html";
    });

    init();
  </script>
</body>
</html>
