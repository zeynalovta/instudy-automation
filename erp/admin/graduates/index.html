<!DOCTYPE html>
<html lang="az">
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTUDY Admin — Məzunlar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:#FF6800; --ink:#17232b; --muted:#6d7b83;
      --line:#dfe7ea; --bg:#f4f7f9; --white:#fff;
    }
    body {
      min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:var(--bg); color:var(--ink);
    }
    #bootScreen {
      min-height:100vh; display:grid; place-items:center; color:var(--muted); padding:24px;
    }
    .shell { display:none; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
    .shell.ready { display:grid; }
    aside { background:#ffe9d6; color:#3a2418; padding:26px 18px; }
    .brand { font-size:28px; font-weight:800; padding:0 10px 28px; }
    .brand span { color:#FF6800; }
    nav a {
      display:block; color:rgba(58,36,24,.62); text-decoration:none;
      padding:12px 14px; border-radius:11px; margin-bottom:6px; font-weight:650; font-size:14px;
    }
    nav a.active { background:#ff6800; color:#fff; }
    main { min-width:0; }
    .topbar {
      min-height:76px; background:#fff; border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; padding:14px 28px; gap:20px;
    }
    .topbar h1 { font-size:21px; }
    .user-area { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13px; }
    .logout {
      border:1px solid var(--line); background:#fff; padding:9px 12px; border-radius:10px;
      cursor:pointer; font-weight:700;
    }
    .content { padding:28px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px; }
    .stat { background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; }
    .stat span { color:var(--muted); font-size:13px; font-weight:700; }
    .stat strong { display:block; font-size:30px; margin-top:7px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
    .panel-head { padding:18px 20px; border-bottom:1px solid var(--line); font-weight:800; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:1250px; }
    th,td { text-align:left; padding:12px 14px; border-bottom:1px solid #edf1f3; font-size:13px; vertical-align:middle; }
    th { color:#6d7b83; font-size:12px; text-transform:uppercase; letter-spacing:.04em; background:#fbfcfd; }
    .badge {
      display:inline-flex; padding:6px 9px; border-radius:999px;
      font-size:11px; font-weight:800; white-space:nowrap;
    }
    .green { background:#e8f7f3; color:#176b58; }
    .yellow { background:#fff7dd; color:#8a6812; }
    .gray { background:#f0f3f5; color:#607078; }
    .mini-select, .note-input, .date-input {
      border:1px solid #d5dfe3; border-radius:9px; padding:7px 9px; font-size:12.5px; font:inherit;
    }
    .note-input { width:150px; }
    .mini-select:disabled, .note-input:disabled, .date-input:disabled { opacity:.6; cursor:wait; }
    .loading,.empty,.error { padding:36px 20px; text-align:center; color:var(--muted); }
    .message { margin:14px 20px 0; padding:11px 13px; border-radius:11px; font-size:13px; display:none; }
    .message.error { display:block; color:#9f3131; background:#fff1f1; border:1px solid #ffd7d7; }
    .message.success { display:block; color:#176b58; background:#eefaf6; border:1px solid #ccece3; }
    @media (max-width:980px) {
      .shell.ready { grid-template-columns:1fr; }
      aside { display:none; }
      .stats { grid-template-columns:1fr 1fr; }
      .content { padding:18px; }
    }
  </style>
</head>
<body>
  <div id="bootScreen" style="
    min-height:100vh; display:grid; place-items:center;
    background:#f4f7f9; color:#6d7b83; padding:24px;
  ">
    <div>Admin panel yoxlanılır...</div>
  </div>

  <div id="appShell" class="shell">
    <aside>
      <div class="brand"><img src="/logo-instudy.png" alt="Instudy" style="height:32px;display:block;"></div>
      <nav>
        <a href="/admin/index.html">Namizədlər</a>
        <a href="/admin/exams/index.html">İmtahanlar</a>
        <a href="/admin/interviews/index.html">Müsahibələr</a>
        <a href="/admin/groups/index.html">DMA qrupları</a>
        <a href="/admin/attendance/index.html">Davamiyyət</a>
        <a class="active" href="/admin/graduates/index.html">Məzunlar</a>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <h1>Məzunlar</h1>
        <div class="user-area">
          <span id="userEmail"></span>
          <button id="logoutButton" class="logout">Çıxış</button>
        </div>
      </header>

      <section class="content">
        <div class="stats">
          <div class="stat"><span>Cəmi (təlimdə + məzun)</span><strong id="totalCount">—</strong></div>
          <div class="stat"><span>Məzun oldu</span><strong id="graduatedCount">—</strong></div>
          <div class="stat"><span>İş tapdı</span><strong id="employedCount">—</strong></div>
        </div>

        <section class="panel">
          <div class="panel-head">Təlimdə və məzun namizədlər</div>
          <div id="tableMessage" class="message"></div>
          <div class="table-wrap">
            <div id="stateMessage" class="loading">Yüklənir...</div>
            <table id="candidateTable" hidden>
              <thead>
                <tr>
                  <th>Namizəd</th>
                  <th>Proqram</th>
                  <th>Qrup</th>
                  <th>Kursun bitmə tarixi</th>
                  <th>Status</th>
                  <th>Məşğulluq</th>
                  <th>İş yeri / qeyd</th>
                  <th>İşə qəbul tarixi</th>
                </tr>
              </thead>
              <tbody id="candidateBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../config.js"></script>
  <script src="/shared/erp-nav.js"></script>
  <script>
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const bootScreen = document.getElementById("bootScreen");
    const appShell = document.getElementById("appShell");
    const stateMessage = document.getElementById("stateMessage");
    const table = document.getElementById("candidateTable");
    const tbody = document.getElementById("candidateBody");
    const tableMessage = document.getElementById("tableMessage");

    let applications = [];

    const stageStatusLabel = { ENROLLED: "Təlimdədir", GRADUATED: "Məzun oldu" };
    const employmentLabel = { SEEKING: "İş axtarır", EMPLOYED: "İş tapdı", NOT_SEEKING: "İş axtarmır" };

    function isAdminUser(user) {
      return user?.app_metadata?.role === "admin";
    }

    // Fail closed: only a claim that is exactly one of these known values
    // is trusted. Missing/null/empty/mistyped staff_scope now resolves to
    // "no_access" instead of silently becoming "all" — the previous
    // fallback here gave a blank claim full super-admin access.
    const VALID_STAFF_SCOPES = ["dma", "all"];
    function getStaffScope(user) {
      const scope = user?.app_metadata?.staff_scope;
      return VALID_STAFF_SCOPES.includes(scope) ? scope : "no_access";
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";
      return new Intl.DateTimeFormat("az-AZ", { day:"2-digit", month:"2-digit", year:"numeric" }).format(new Date(value));
    }

    function renderAccessGate(title, message) {
      bootScreen.innerHTML = `
        <div style="width:min(100%,460px);background:#fff;border:1px solid #dfe7ea;border-radius:20px;padding:30px;text-align:center;box-shadow:0 18px 45px rgba(20,46,55,.08);">
          <div style="margin-bottom:10px;"><img src="/logo-instudy.png" alt="Instudy" style="height:44px;display:block;margin:0 auto 10px;"></div>
          <h2 style="font-size:20px;margin-bottom:10px;">${escapeHtml(title)}</h2>
          <p style="color:#6d7b83;line-height:1.6;margin-bottom:20px;">${escapeHtml(message)}</p>
          <a href="/admin/login/index.html" style="display:inline-block;background:#FF6800;color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800;">Giriş səhifəsinə keç</a>
        </div>
      `;
    }

    function employmentBadgeClass(value) {
      if (value === "EMPLOYED") return "green";
      if (value === "SEEKING") return "yellow";
      return "gray";
    }

    function showTableMessage(type, text) {
      tableMessage.className = "message " + type;
      tableMessage.textContent = text;
    }

    function renderStats() {
      document.getElementById("totalCount").textContent = applications.length;
      document.getElementById("graduatedCount").textContent =
        applications.filter(a => a.current_status === "GRADUATED").length;
      document.getElementById("employedCount").textContent =
        applications.filter(a => a.employment_status === "EMPLOYED").length;
    }

    function renderTable() {
      tbody.innerHTML = applications.map(item => {
        const c = item.candidates || {};
        const p = item.programs || {};
        const g = item.training_groups || {};

        return `
          <tr>
            <td><a href="/admin/candidates/index.html?id=${item.id}" style="color:var(--ink);font-weight:800;text-decoration:none;">${escapeHtml(c.full_name || "—")}</a></td>
            <td>${escapeHtml(p.name || "—")}</td>
            <td>${escapeHtml(g.name || "—")}</td>
            <td>${formatDate(g.ends_at)}</td>
            <td>
              <select class="mini-select stage-select" data-id="${item.id}" data-previous-value="${item.current_status}">
                ${Object.entries(stageStatusLabel).map(([value, label]) => `
                  <option value="${value}" ${value === item.current_status ? "selected" : ""}>${escapeHtml(label)}</option>
                `).join("")}
              </select>
            </td>
            <td>
              <select class="mini-select employment-select" data-id="${item.id}" data-previous-value="${item.employment_status ?? ""}">
                <option value="" ${!item.employment_status ? "selected" : ""}>—</option>
                ${Object.entries(employmentLabel).map(([value, label]) => `
                  <option value="${value}" ${item.employment_status === value ? "selected" : ""}>${escapeHtml(label)}</option>
                `).join("")}
              </select>
            </td>
            <td>
              <input type="text" class="note-input employment-note-input" data-id="${item.id}"
                value="${escapeHtml(item.employment_note || "")}" data-previous-value="${escapeHtml(item.employment_note || "")}"
                placeholder="Şirkət / vəzifə...">
            </td>
            <td>
              <input type="date" class="date-input employment-date-input" data-id="${item.id}"
                value="${item.employed_at || ""}" data-previous-value="${item.employed_at || ""}">
            </td>
          </tr>
        `;
      }).join("");

      stateMessage.hidden = true;
      table.hidden = false;

      if (!applications.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">Hələ təlimdə/məzun namizəd yoxdur.</td></tr>`;
      }
    }

    async function updateStage(applicationId, newStatus, selectEl) {
      const previousValue = selectEl.dataset.previousValue;
      selectEl.disabled = true;

      const { error } = await client
        .from("dma_applications")
        .update({ current_status: newStatus })
        .eq("id", applicationId);

      selectEl.disabled = false;

      if (error) {
        console.error("Stage update error:", error);
        showTableMessage("error", "Status yenilənmədi: " + error.message);
        selectEl.value = previousValue;
        return;
      }

      selectEl.dataset.previousValue = newStatus;
      const item = applications.find(a => a.id === applicationId);
      if (item) item.current_status = newStatus;
      renderStats();
      showTableMessage("success", "Status yeniləndi: " + (stageStatusLabel[newStatus] || newStatus));
    }

    async function updateEmploymentStatus(applicationId, value, selectEl) {
      const previousValue = selectEl.dataset.previousValue;
      const newValue = value || null;
      selectEl.disabled = true;

      const { error } = await client
        .from("dma_applications")
        .update({ employment_status: newValue })
        .eq("id", applicationId);

      selectEl.disabled = false;

      if (error) {
        console.error("Employment status update error:", error);
        showTableMessage("error", "Məşğulluq statusu yenilənmədi: " + error.message);
        selectEl.value = previousValue;
        return;
      }

      selectEl.dataset.previousValue = newValue || "";
      const item = applications.find(a => a.id === applicationId);
      if (item) item.employment_status = newValue;
      renderStats();
      showTableMessage("success", "Məşğulluq statusu yeniləndi.");
    }

    async function updateEmploymentField(applicationId, field, value, inputEl) {
      const previousValue = inputEl.dataset.previousValue;
      const newValue = value === "" ? null : value;
      inputEl.disabled = true;

      const { error } = await client
        .from("dma_applications")
        .update({ [field]: newValue })
        .eq("id", applicationId);

      inputEl.disabled = false;

      if (error) {
        console.error("Employment field update error:", error);
        showTableMessage("error", "Yenilənmədi: " + error.message);
        inputEl.value = previousValue;
        return;
      }

      inputEl.dataset.previousValue = newValue || "";
      const item = applications.find(a => a.id === applicationId);
      if (item) item[field] = newValue;
      showTableMessage("success", "Saxlanıldı.");
    }

    tbody.addEventListener("change", event => {
      const stageEl = event.target.closest(".stage-select");
      if (stageEl) {
        updateStage(Number(stageEl.dataset.id), stageEl.value, stageEl);
        return;
      }

      const employmentEl = event.target.closest(".employment-select");
      if (employmentEl) {
        updateEmploymentStatus(Number(employmentEl.dataset.id), employmentEl.value, employmentEl);
        return;
      }

      const noteEl = event.target.closest(".employment-note-input");
      if (noteEl) {
        updateEmploymentField(Number(noteEl.dataset.id), "employment_note", noteEl.value.trim(), noteEl);
        return;
      }

      const dateEl = event.target.closest(".employment-date-input");
      if (dateEl) {
        updateEmploymentField(Number(dateEl.dataset.id), "employed_at", dateEl.value, dateEl);
      }
    });

    async function loadData() {
      const { data, error } = await client
        .from("dma_applications")
        .select(`
          id,
          current_status,
          employment_status,
          employment_note,
          employed_at,
          dma_candidates!dma_applications_candidate_id_fkey ( full_name, whatsapp_phone ),
          dma_programs!dma_applications_program_id_fkey ( name ),
          dma_training_groups!dma_applications_training_group_id_fkey ( name, ends_at )
        `)
        .in("current_status", ["ENROLLED", "GRADUATED"])
        .order("id", { ascending: false });

      if (error) {
        console.error("Load data error:", error);
        stateMessage.className = "error";
        stateMessage.textContent = "Məlumatlar yüklənmədi: " + error.message;
        return;
      }

      applications = data || [];
      renderStats();
      renderTable();
    }

    async function init() {
      try {
        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          renderAccessGate("Admin girişi tələb olunur", "Bu səhifəni görmək üçün əvvəlcə sistemə daxil olun.");
          return;
        }

        const { data: userData, error: userError } = await client.auth.getUser();
        if (userError) throw userError;

        const user = userData.user;

        if (!isAdminUser(user)) {
          await client.auth.signOut();
          renderAccessGate("Giriş qadağandır", "Bu hesabın admin panelinə giriş icazəsi yoxdur.");
          return;
        }

        if (!["dma", "all"].includes(getStaffScope(user))) {
          renderAccessGate("Giriş qadağandır", "Bu hesabın bu panelə giriş icazəsi yoxdur.");
          return;
        }

        document.getElementById("userEmail").textContent = user.email || "";
        bootScreen.style.display = "none";
        appShell.classList.add("ready");

        await loadData();

      } catch (error) {
        console.error("Admin graduates init error:", error);
        bootScreen.textContent = "Admin panel açılmadı: " + (error.message || "Naməlum xəta");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "/admin/login/index.html";
    });

    init();
  </script>
</body>
</html>
